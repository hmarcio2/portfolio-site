# Deploy na VPS da Hostinger: build -> GHCR -> SSH -> docker compose up --wait.
# Por enquanto só roda manualmente (Actions > Deploy > Run workflow). Quando a VPS estiver pronta
# (veja README, "Deploy"), troque o gatilho por push na main, descomentando as linhas abaixo.
name: Deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hmarcio2/portfolio-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar arquivos e atualizar o serviço
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes $VPS_USER@$VPS_HOST"
          SCP="scp -i $HOME/.ssh/deploy_key -P $VPS_PORT -o StrictHostKeyChecking=yes"
          APP_DIR=/opt/apps/site

          $SSH "mkdir -p $APP_DIR"
          $SCP compose.yml "$VPS_USER@$VPS_HOST:$APP_DIR/compose.yml"
          # Login temporário no GHCR com o token do job (expira com o job; nada fica salvo na VPS).
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u $GHCR_USER --password-stdin"
          $SSH "cd $APP_DIR && IMAGE_TAG=$IMAGE_TAG docker compose -f compose.yml pull && IMAGE_TAG=$IMAGE_TAG docker compose -f compose.yml up -d --wait --wait-timeout 240 --remove-orphans"
          $SSH "docker logout ghcr.io; docker image prune -f"
