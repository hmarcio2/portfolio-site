# Produção/VPS: puxa a imagem do GHCR. A rede "edge" é criada pelo repositório portfolio-edge.
services:
  site:
    image: ${IMAGE:-ghcr.io/hmarcio2/portfolio-site}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

networks:
  edge:
    external: true
    name: edge
