name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt pytest
      - name: Testes do gerador e do conteúdo
        run: python -m pytest tests -q
      - name: Gerar o site
        run: python build.py

  docker:
    needs: build-site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portfolio-site:ci
      - name: Subir o container e checar a página
        run: |
          docker run -d --name site -p 8080:8080 portfolio-site:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Heriberto"; then exit 0; fi
            sleep 1
          done
          docker logs site
          exit 1
